[workspace]
members = [
    ".",
    "crates/audio",
    "crates/stt",
    "crates/bible",
    "crates/songs",
    "crates/detection",
    "crates/broadcast",
    "crates/api",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that pedantic warns about
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "fellowshow"
version = "0.1.48"
description = "Fellow Show - Real-Time AI Bible Verse Detection"
authors = ["Faithful"]
license = "MIT"
repository = "https://github.com/openbezal/fellowshow"
edition = "2021"
rust-version = "1.90"

[lib]
name = "fellowshow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fellowshow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
fellowshow-audio = { path = "crates/audio" }
fellowshow-bible = { path = "crates/bible" }
fellowshow-songs = { path = "crates/songs" }
fellowshow-stt = { path = "crates/stt" }
fellowshow-broadcast = { path = "crates/broadcast" }
fellowshow-detection = { path = "crates/detection", features = ["onnx", "vector-search"] }
fellowshow-api = { path = "crates/api" }
crossbeam-channel = "0.5"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
rusqlite = { version = "0.34", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Pin the upstream ZIP 9 security update until it is published to crates.io.
tauri-plugin-updater = { version = "2.14.0", git = "https://github.com/tauri-apps/plugins-workspace", rev = "f36ba7ba48695776bc11cce0bfdc45678ec24f72" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = ["whisper"]
whisper = ["fellowshow-stt/whisper"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
