name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Tags cannot reuse another tag's build cache, only main's. This nightly run
  # on main compiles the release app (without bundling or publishing) so the
  # next tag starts from a warm cache instead of compiling everything.
  schedule:
    - cron: "0 3 * * *"

# Jobs that need more ask for it themselves.
permissions:
  contents: read

# Never cancel a release that is already building.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
  # The nightly run only warms the cache.
  WARM_CACHE_ONLY: ${{ github.event_name == 'schedule' }}

jobs:
  # The same checks as pull requests. They run alongside the builds so they
  # add no time, and nothing is published unless they pass.
  ci:
    name: CI
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  prepare-bible-db:
    name: Prepare Bible database
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bible database cache
        id: bible-db-cache
        uses: actions/cache@v6
        with:
          path: data/fellowshow.db
          key: bible-db-catalog-${{ hashFiles('data/schema.sql', 'data/build-bible-db.ts', 'data/prepare-release-bible.ts') }}

      - name: Install dependencies
        if: steps.bible-db-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build Bible database
        if: steps.bible-db-cache.outputs.cache-hit != 'true'
        run: bun run prepare:release-bible

      - name: Verify Bible database
        run: |
          test -s data/fellowshow.db
          bun -e "const { Database } = require('bun:sqlite'); const db = new Database('data/fellowshow.db'); const translations = db.query('select count(*) as count from translations').get().count; const verses = db.query('select count(*) as count from verses').get().count; console.log(translations + ' translation catalog entries'); console.log(verses + ' embedded verses'); if (verses !== 0) process.exit(1);"

      - name: Upload Bible database
        uses: actions/upload-artifact@v7
        with:
          name: fellowshow-bible-db
          path: data/fellowshow.db
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare-bible-db
    timeout-minutes: 60
    env:
      # sccache caches compiler outputs by toolchain, target, flags, and source
      # inputs, so source and patch-version changes reuse unaffected crates.
      # A cache outage must never make a release build fail.
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            bundle_args: --bundles nsis
            artifact_name: fellowshow-windows-installer
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/nsis/latest.json
          - name: macOS package
            os: macos-latest
            bundle_args: --bundles app,dmg
            artifact_name: fellowshow-macos-dmg
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.tar.gz
              src-tauri/target/release/bundle/macos/*.tar.gz.sig
              src-tauri/target/release/bundle/macos/latest.json
              src-tauri/target/release/bundle/dmg/*.dmg.sig
              src-tauri/target/release/bundle/dmg/latest.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Installs the version pinned in src-tauri/rust-toolchain.toml.
      - name: Set up Rust
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          # Only main's cache is visible to later tags, so tag runs restore
          # it without saving copies that would push it out of storage.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libreoffice-calc \
            libreoffice-impress \
            libreoffice-writer \
            librsvg2-dev \
            patchelf

      - name: Install Windows build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake nsis -y --no-progress
          $llvmBin = Join-Path ${env:ProgramFiles} "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "libclang.dll was not found at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install bundled document converter source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install libreoffice-fresh -y --no-progress

      - name: Install bundled document converter source on macOS
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Bible database
        uses: actions/download-artifact@v8
        with:
          name: fellowshow-bible-db
          path: data

      - name: Verify bundled Bible database exists
        run: bun -e "if (!require('node:fs').statSync('data/fellowshow.db').size) process.exit(1)"

      - name: Stage bundled document converter
        run: bun run prepare:document-converter

      - name: Build release app to warm the cache
        if: env.WARM_CACHE_ONLY == 'true'
        run: bunx tauri build --no-bundle

      - name: Build bundles
        if: env.WARM_CACHE_ONLY != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build ${{ matrix.bundle_args }}

      - name: Verify installer silently installs
        if: runner.os == 'Windows' && env.WARM_CACHE_ONLY != 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows NSIS installer was produced."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "FellowShowInstall"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)."
          }

          $installedApp = Get-ChildItem -Path $installDir -Filter "fellowshow.exe" -Recurse | Select-Object -First 1
          if (-not $installedApp) {
            $installedApp = Get-ChildItem -Path $installDir -Filter "FellowShow.exe" -Recurse | Select-Object -First 1
          }
          if (-not $installedApp) {
            throw "Installer completed, but the FellowShow executable was not found in $installDir."
          }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Verified $($installer.Name) installs to $installDir"

      - name: Upload bundle artifact
        if: env.WARM_CACHE_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          mkdir -p release-upload
          while IFS= read -r file; do
            name="$(basename "$file")"
            if [ "$name" = "latest.json" ]; then
              continue
            fi
            name="${name// /.}"
            if [ -e "release-upload/$name" ]; then
              parent="$(basename "$(dirname "$file")")"
              name="${parent}-${name}"
            fi
            cp "$file" "release-upload/$name"
          done < <(find release-artifacts -maxdepth 4 -type f)
          bun run data/merge-tauri-updater-manifests.ts \
            release-artifacts \
            release-upload/latest.json \
            "$tag" \
            "${{ github.repository }}"
          find release-upload -maxdepth 1 -type f -print | sort
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run replaces the files and keeps the release, its notes
            # and its download counts.
            gh release upload "$tag" release-upload/* --clobber
          else
            # Draft first, so nobody downloads a half-uploaded release.
            gh release create "$tag" \
              --draft \
              --title "Fellow Show $tag" \
              --generate-notes \
              release-upload/*
            gh release edit "$tag" --draft=false
          fi
