<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Identify screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111111;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        cursor: default;
        user-select: none;
      }
      .card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        border: 6px solid #facc15;
        background: #111111;
        color: #ffffff;
        text-align: center;
      }
      .title {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .detail {
        font-size: 36px;
        font-weight: 600;
        color: #facc15;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title" id="title"></div>
      <div class="detail" id="detail"></div>
    </div>
    <script src="./identify-screen.js"></script>
  </body>
</html>
