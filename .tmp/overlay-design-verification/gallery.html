<!doctype html><html lang="en"><meta charset="utf-8"><title>Lower-third renderer verification</title>
<link rel="stylesheet" href="/src/index.css"><style>body{margin:0;background:#101014;color:#fff;font:14px 'Inter Variable',sans-serif;padding:24px}h1{font-size:20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{border:1px solid #444;border-radius:8px;overflow:hidden}h2{font-size:13px;margin:10px 12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#172034}button{background:#fff;color:#111;padding:8px;margin:8px}</style>
<h1>All 15 lower-third designs</h1><button id="long">Show long names</button><main></main><script type="module">
import { drawBroadcastOverlays } from '/src/lib/overlay-renderer.ts';
import { LOWER_THIRD_DESIGN_OPTIONS } from '/src/types/lower-third-designs.ts';
await Promise.all([document.fonts.load('700 64px "Inter Variable"'),document.fonts.load('300 64px "Inter Variable"'),document.fonts.load('600 64px "Fraunces Variable"'),document.fonts.load('italic 400 38px "Fraunces Variable"'),document.fonts.load('700 80px "Barlow Condensed"')]);
let long=false;const main=document.querySelector('main');
function draw(){main.replaceChildren();for(const option of LOWER_THIRD_DESIGN_OPTIONS){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=option.label;const canvas=document.createElement('canvas');canvas.width=1920;canvas.height=1080;article.append(title,canvas);main.append(article);const ctx=canvas.getContext('2d');const gradient=ctx.createLinearGradient(0,0,1920,1080);gradient.addColorStop(0,'#263d5b');gradient.addColorStop(.5,'#5f345a');gradient.addColorStop(1,'#102329');ctx.fillStyle=gradient;ctx.fillRect(0,0,1920,1080);ctx.fillStyle='#080b15';ctx.beginPath();ctx.arc(1250,360,100,0,Math.PI*2);ctx.fill();ctx.fillRect(1120,460,260,620);drawBroadcastOverlays(ctx,{width:1920,height:1080},{logos:[],ticker:null,lowerThird:{id:option.value,theme:'speaker',style:option.value,title:long?'Reverend Alexander Mensah Boateng Agyeman':'Daniel Mensah',subtitle:long?'Regional coordinator for community education and outreach programs':'Guest speaker',backgroundColor:option.defaultBackgroundColor,textColor:option.defaultTextColor,widthPercent:option.value==='centered'?80:72,anchor:option.value==='centered'?'bottom-center':'bottom-left',xPercent:option.value==='centered'?50:5,yPercent:option.value==='centered'?91:89,durationMs:14000,startedAt:0}},{now:2500});}document.body.dataset.ready='true';}
document.querySelector('button').onclick=()=>{long=!long;draw()};draw();
</script></html>
